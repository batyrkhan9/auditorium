[project]
name = "auditorium-contracts"
version = "0.1.0"
description = "The shared data format every Auditorium area reads and writes."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pypdf>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auditorium_contracts"]
