[project]
name = "auditorium-ui"
version = "0.0.0"
description = "The screen: results, evidence, the log and reviewer sign-off."
requires-python = ">=3.12"
dependencies = ["auditorium-contracts"]

[tool.uv.sources]
auditorium-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auditorium_ui"]
