[project]
name = "auditorium-evals"
version = "0.0.0"
description = "Scores a run against the sealed answer key."
requires-python = ">=3.12"
dependencies = ["auditorium-contracts"]

[tool.uv.sources]
auditorium-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auditorium_evals"]
