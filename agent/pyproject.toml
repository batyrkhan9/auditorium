[project]
name = "auditorium-agent"
version = "0.0.0"
description = "The audit agent: four checks, sample requests, drafts, the log."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.7.0",
    "auditorium-contracts",
]

[tool.uv.sources]
auditorium-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auditorium_agent"]
