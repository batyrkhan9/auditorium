[project]
name = "auditorium-connectors"
version = "0.0.0"
description = "Ramp and QuickBooks connections behind the contract's Sources interface."
requires-python = ">=3.12"
dependencies = ["auditorium-contracts", "mcp>=1.9", "httpx>=0.27"]

[tool.uv.sources]
auditorium-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auditorium_connectors"]
